# Optional local database for development, following Neon's local dev guide
# (https://neon.com/guides/local-development-with-neon). The proxy lets the
# same neon-http driver we use in production talk to a plain Postgres.
#
#   docker compose up -d
#   DATABASE_URL=postgresql://postgres:postgres@db.localtest.me:5432/main
services:
  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: main
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  neon-proxy:
    image: ghcr.io/timowilhelm/local-neon-http-proxy:main
    ports:
      - "4444:4444"
    environment:
      PG_CONNECTION_STRING: postgres://postgres:postgres@postgres:5432/main
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  db_data:
